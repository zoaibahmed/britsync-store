version: '3.8'

services:
  britsync-db:
    image: postgres:16-alpine
    container_name: britsync-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: britsync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  britsync-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: britsync-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@britsync-db:5432/britsync?schema=public
      - NODE_ENV=production
    depends_on:
      britsync-db:
        condition: service_healthy

volumes:
  postgres_data:
