<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" width="100%" height="100%">
  <!-- Style Definition -->
  <defs>
    <style>
      .seal-bg { fill: none; stroke: #D4AF37; stroke-width: 1.2; stroke-miterlimit: 10; }
      .seal-inner { fill: none; stroke: #D4AF37; stroke-width: 0.8; stroke-dasharray: 2 2; }
      .seal-crest { fill: #D4AF37; }
      .brand-text { font-family: 'Playfair Display', Georgia, serif; font-size: 16px; font-weight: 400; fill: currentColor; letter-spacing: 5px; }
      .sub-text { font-family: 'Inter', sans-serif; font-size: 5px; font-weight: 300; fill: currentColor; opacity: 0.6; letter-spacing: 3px; }
    </style>
  </defs>

  <!-- Cryptographic Provenance Seal -->
  <g transform="translate(10, 0)">
    <!-- Outer Octagon/Circle Seal representing ledger validation -->
    <circle cx="20" cy="20" r="14" class="seal-bg" />
    <circle cx="20" cy="20" r="11.5" class="seal-inner" />
    
    <!-- Central Geometric Crest -->
    <path d="M20,11 L25,16 L25,24 L20,29 L15,24 L15,16 Z" class="seal-bg" />
    <!-- Center Vault/Ledger Nodes -->
    <circle cx="20" cy="20" r="2.5" class="seal-crest" />
    <line x1="20" y1="11" x2="20" y2="29" class="seal-inner" />
    <line x1="15" y1="20" x2="25" y2="20" class="seal-inner" />
  </g>

  <!-- Typography -->
  <text x="54" y="22" class="brand-text">BRITSYNC</text>
  <text x="55" y="29" class="sub-text">ESTABLISHED PROVENANCE</text>
</svg>
